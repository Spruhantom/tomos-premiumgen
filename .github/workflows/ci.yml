name: Premium Generator CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[server]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: tomos-premiumgen --help
      - name: Check GTK module syntax and lazy import
        run: |
          python -m compileall -q src
          python -c "from tomos_premiumgen.gui import run_gui; assert callable(run_gui)"
      - name: Check installer syntax
        run: bash -n install.sh
