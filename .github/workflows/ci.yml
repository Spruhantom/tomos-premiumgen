name: Premium Generator CI

on:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[server]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: tomos-premiumgen --help
      - name: Check GTK module syntax and lazy import
        run: |
          python -m compileall -q src
          python -c "from tomos_premiumgen.gui import run_gui; assert callable(run_gui)"
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Test installer distribution detection without system changes
        run: bash tests/test_installer.sh

  gtk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 runtime and headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 python3-cryptography python3-qrcode python3-pil xvfb
      - name: Launch GTK application in a headless display
        shell: bash
        run: |
          set +e
          PYTHONPATH=src timeout 8s xvfb-run -a /usr/bin/python3 -c 'from tomos_premiumgen.gui import run_gui; run_gui()'
          status=$?
          set -e
          if [[ "$status" -ne 124 ]]; then
            echo "GTK application exited unexpectedly (status $status)." >&2
            exit "$status"
          fi
          echo "GTK application launched and remained running for 8 seconds."

  arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arch build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git python python-build python-installer python-setuptools python-cryptography python-qrcode python-pillow python-textual python-gobject gtk4
      - name: Build package as an unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- makepkg --nodeps --noconfirm
      - name: Verify package archive was created
        run: test -n "$(find . -maxdepth 1 -name 'tomos-premiumgen-*.pkg.tar.*' -print -quit)"

  installer-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:stable-slim
          - distro: fedora
            image: fedora:latest
          - distro: arch
            image: archlinux:latest
    container:
      image: ${{ matrix.image }}
    env:
      HOME: /tmp/tomos-home
      XDG_DATA_HOME: /tmp/tomos-data
      XDG_BIN_HOME: /tmp/tomos-bin
    steps:
      - uses: actions/checkout@v4
      - name: Install installer prerequisites on Debian
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl python3
      - name: Install installer prerequisites on Fedora
        if: matrix.distro == 'fedora'
        run: dnf install -y curl python3
      - name: Install installer prerequisites on Arch
        if: matrix.distro == 'arch'
        run: pacman -Syu --noconfirm --needed curl python
      - name: Run complete user-space installation
        run: |
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_BIN_HOME"
          bash install.sh
          "$XDG_BIN_HOME/tomos-premiumgen" --help
          test -x "$XDG_BIN_HOME/tomos-premiumgen-gui"
          test -f "$XDG_DATA_HOME/applications/tomos-premiumgen.desktop"
      - name: Verify clean uninstall
        run: |
          bash install.sh --uninstall
          test ! -e "$XDG_DATA_HOME/tomos-premiumgen"
          test ! -e "$XDG_BIN_HOME/tomos-premiumgen"
          test ! -e "$XDG_BIN_HOME/tomos-premiumgen-tui"
          test ! -e "$XDG_BIN_HOME/tomos-premiumgen-gui"
          test ! -e "$XDG_DATA_HOME/applications/tomos-premiumgen.desktop"
