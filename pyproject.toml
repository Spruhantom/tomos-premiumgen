[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomos-premiumgen"
version = "0.2.0"
description = "TomOS SIP Premium lifetime licence generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=42.0.0", "qrcode[pil]>=8.2", "textual>=0.80.0"]

[project.optional-dependencies]
server = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
test = ["httpx>=0.27.0"]

[project.scripts]
tomos-premiumgen = "tomos_premiumgen.cli:main"
tomos-premiumgen-tui = "tomos_premiumgen.tui:run_tui"
tomos-premiumgen-gui = "tomos_premiumgen.gui:run_gui"
tomos-premiumgen-server = "tomos_premiumgen.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
